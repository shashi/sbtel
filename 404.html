<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found: sbtel</title>
<meta name="color-scheme" content="light dark">
<style>
/* Self-contained: GitHub Pages serves this page at any missing path, so relative asset paths would not resolve. */
:root { --canvas:#EEEDE9; --dot:#DCDAD3; --surface:#FFFFFF; --frame-line:#9A968D; --leaf:#F6F0E3; --ink:#1E1C19; --muted:#6B675E; --accent:#1F57C6; --warn:#C9371F; --warn-soft:#FBE3DF; }
@media (prefers-color-scheme: dark) { :root { --canvas:#151617; --dot:#232527; --surface:#1F2022; --frame-line:#6E6B65; --leaf:#2C2925; --ink:#ECEAE5; --muted:#A29E95; --accent:#9DBBFF; --warn:#FF6B57; --warn-soft:#3D221E; } }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--canvas); color:var(--ink);
  font:17px/1.6 "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  background-image:radial-gradient(var(--dot) 1px, transparent 1.2px); background-size:22px 22px; }
main { width:min(440px, 100%); }
.frame { background:var(--surface); border:1.5px solid var(--frame-line); border-radius:14px; padding:18px 22px 26px; }
.lname { display:flex; align-items:center; gap:10px; font-size:14px; color:var(--muted); }
.lname::after { content:""; flex:1; border-top:1.5px solid var(--frame-line); opacity:.55; }
.row { display:flex; justify-content:center; padding:22px 0 6px; }
.blk { background:var(--leaf); border:1.5px dashed var(--warn); border-radius:12px; padding:10px 16px; font-family:ui-monospace, Menlo, Consolas, monospace; font-size:14px; max-width:100%; overflow-wrap:anywhere; }
h1 { font-size:28px; line-height:1.2; margin:28px 0 8px; letter-spacing:-.015em; }
p { margin:0 0 12px; color:var(--muted); }
a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="frame" aria-hidden="true">
    <div class="lname">This site</div>
    <div class="row"><div class="blk" id="path">unknown</div></div>
  </div>
  <h1>No page here</h1>
  <p>This address names nothing on the sbtel site. In <code>sbtel check</code> terms: unknown.</p>
  <p><a id="home" href="/sbtel/">Go to the sbtel home page</a></p>
</main>
<script>
  // Point home at this site's root, wherever it is served from.
  const p = location.pathname, i = p.indexOf('/sbtel/');
  document.getElementById('home').href = i >= 0 ? p.slice(0, i + 7) : '/';
  document.getElementById('path').textContent = decodeURIComponent(p);
</script>
</body>
</html>
