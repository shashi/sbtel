<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="system-ui, sans-serif" font-size="14">
  <rect width="640" height="250" fill="#fbfaf7"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5563"/></marker></defs>
  <text x="32" y="38" font-size="17" font-weight="600" fill="#1d2330">Write beside, then rename</text>
  <g fill="#fff" stroke="#9aa3b2" stroke-width="1.5">
    <rect x="32" y="70" width="150" height="56" rx="9"/>
    <rect x="245" y="70" width="170" height="56" rx="9" stroke-dasharray="5 4"/>
    <rect x="478" y="70" width="130" height="56" rx="9" stroke="#2f6fed"/>
  </g>
  <g fill="#1d2330" text-anchor="middle">
    <text x="107" y="103">the note's text</text>
    <text x="330" y="96">groceries.md.tmp</text><text x="330" y="114" font-size="12" fill="#6b7280">a new file beside it</text>
    <text x="543" y="103">groceries.md</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M182 98H241"/><path d="M415 98H474"/></g>
  <g fill="#4b5563" font-size="12.5" text-anchor="middle"><text x="212" y="88">1 write</text><text x="445" y="88">2 rename</text></g>
  <text x="32" y="172" fill="#374151">A crash during step 1 leaves the old note whole and a stray .tmp file.</text>
  <text x="32" y="196" fill="#374151">Step 2 swaps the name in one move, so a reader sees the old note or the new one,</text>
  <text x="32" y="216" fill="#374151">never half of each.</text>
</svg>
